spring:
  datasource:
    url: jdbc:h2:mem:partner_test;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS partner_schema
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: partner_schema

eureka:
  client:
    enabled: false
