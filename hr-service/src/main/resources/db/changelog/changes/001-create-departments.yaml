databaseChangeLog:
  - changeSet:
      id: 001-create-departments
      author: youssef
      changes:
        - createTable:
            tableName: departments
            schemaName: hr_schema
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
