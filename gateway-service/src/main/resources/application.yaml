server:
  port: 8082

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true

      routes:
        - id: hr-service
          uri: lb://HR-SERVICE
          predicates:
            - Path=/api/employees/**

        - id: hr-departments
          uri: lb://HR-SERVICE
          predicates:
            - Path=/api/departments/**

        - id: mission-service
          uri: lb://MISSION-SERVICE
          predicates:
            - Path=/api/missions/**

        - id: message-router
          uri: lb://MESSAGE-ROUTER
          predicates:
            - Path=/api/messages/**,/api/message/**

        - id: partner-service
          uri: lb://PARTNER-SERVICE
          predicates:
            - Path=/api/partners/**

        - id: account-service
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/accounts/**
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**

        - id: ai-service
          uri: lb://AI-SERVICE
          predicates:
            - Path=/api/ai/**

        - id: leave-service
          uri: lb://LEAVE-SERVICE
          predicates:
            - Path=/api/leaves/**


eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/


logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2.server.resource: TRACE
    org.springframework.security.oauth2.jwt: TRACE
    

