databaseChangeLog:
  - changeSet:
      id: 001-create-missions
      author: youssef
      changes:
        - createTable:
            tableName: missions
            schemaName: mission_schema
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(255)

              - column:
                  name: start_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: end_date
                  type: TIMESTAMP

              - column:
                  name: assigned_employee_id
                  type: BIGINT
                  constraints:
                    nullable: false
