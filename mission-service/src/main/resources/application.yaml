server:
  port: 8084

spring:
  application:
    name: MISSION-SERVICE

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://host.docker.internal:8081/realms/spring-app/protocol/openid-connect/certs

  main:
    allow-bean-definition-overriding: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bankapp}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:bankapp}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: mission_schema

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: mission_schema
    liquibase-schema: mission_schema

  feign:
    client:
      config:
        default:
          connectTimeout: 5000
          readTimeout: 5000

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/