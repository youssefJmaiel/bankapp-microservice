spring:
  datasource:
    url: jdbc:h2:mem:mission_test;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS mission_schema
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: mission_schema

  # Les tests de contexte ne doivent pas dépendre d'un serveur Keycloak.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/realms/spring-app/protocol/openid-connect/certs

eureka:
  client:
    enabled: false

mission:
  notifications:
    mq-enabled: false

ibm:
  mq:
    user: test
    password: test
