databaseChangeLog:
  - changeSet:
      id: 001-create-payments
      author: bankapp
      changes:
        - createTable:
            tableName: payments
            schemaName: payment_schema
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_payments
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: reference
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_payments_reference
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - sql:
            sql: >
              ALTER TABLE payment_schema.payments
              ADD CONSTRAINT chk_payments_amount_positive CHECK (amount > 0)
        - sql:
            sql: >
              ALTER TABLE payment_schema.payments
              ADD CONSTRAINT chk_payments_status
              CHECK (status IN ('PENDING', 'COMPLETED', 'FAILED'))
