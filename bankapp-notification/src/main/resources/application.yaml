server:
  port: 8086

spring:
  application:
    name: bankapp-notification

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/spring-app
          jwk-set-uri: http://localhost:8081/realms/spring-app/protocol/openid-connect/certs

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# IBM MQ - mission assignment events
ibm:
  mq:
    host: ${MQ_HOST:ibm-mq}
    port: ${MQ_PORT:1414}
    queue-manager: ${MQ_QUEUE_MANAGER:QM1}
    channel: ${MQ_CHANNEL:DEV.APP.SVRCONN}
    user: ${MQ_USER_IBM}
    password: ${MQ_PASSWORD_IBM}
    mission-assigned-queue: ${MQ_MISSION_ASSIGNED_QUEUE:MISSION.ASSIGNED}
