databaseChangeLog:
  - changeSet:
      id: 002-create-partners
      author: youssef
      changes:
        - createTable:
            tableName: partners
            schemaName: message_schema
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: alias
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: direction
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: application
                  type: VARCHAR(255)

              - column:
                  name: processed_flow_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
