databaseChangeLog:
  - changeSet:
      id: 001-create-messages
      author: youssef
      changes:
        - createTable:
            tableName: messages
            schemaName: message_schema
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: content
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: sender
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: receiver
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: timestamp
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: processed
                  type: BOOLEAN
                  constraints:
                    nullable: false
