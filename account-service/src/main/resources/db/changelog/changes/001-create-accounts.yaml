databaseChangeLog:
  - changeSet:
      id: 001-create-account-schema
      author: youssef
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS account_schema

  - changeSet:
      id: 002-create-accounts
      author: youssef
      changes:
        - createTable:
            tableName: accounts
            schemaName: account_schema
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_accounts
                    nullable: false

              - column:
                  name: account_number
                  type: VARCHAR(34)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_accounts_account_number

              - column:
                  name: owner_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(3)
                  defaultValue: TND
                  constraints:
                    nullable: false

              - column:
                  name: balance
                  type: DECIMAL(19,2)
                  defaultValueNumeric: 0.00
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - sql:
            sql: ALTER TABLE account_schema.accounts ADD CONSTRAINT chk_accounts_balance_nonnegative CHECK (balance >= 0)

        - sql:
            sql: ALTER TABLE account_schema.accounts ADD CONSTRAINT chk_accounts_status CHECK (status IN ('ACTIVE', 'BLOCKED', 'CLOSED'))

        - sql:
            sql: ALTER TABLE account_schema.accounts ADD CONSTRAINT chk_accounts_currency CHECK (currency ~ '^[A-Z]{3}$')
