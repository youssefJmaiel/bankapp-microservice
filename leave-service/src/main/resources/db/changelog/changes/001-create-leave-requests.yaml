databaseChangeLog:
  - changeSet:
      id: 001-create-leave-requests
      author: bankapp
      changes:
        - createTable:
            tableName: leave_requests
            schemaName: leave_schema
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_leave_requests
                    nullable: false
              - column:
                  name: requester_username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: decision_by
                  type: VARCHAR(100)
              - column:
                  name: decision_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - sql:
            sql: >
              ALTER TABLE leave_schema.leave_requests
              ADD CONSTRAINT chk_leave_dates
              CHECK (end_date >= start_date)
        - sql:
            sql: >
              ALTER TABLE leave_schema.leave_requests
              ADD CONSTRAINT chk_leave_status
              CHECK (status IN ('PENDING', 'APPROVED', 'REJECTED', 'CANCELLED'))
